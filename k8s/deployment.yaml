apiVersion: apps/v1
kind: Deployment
metadata:
  name: memlab
  namespace: default
  labels:
    app: memlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memlab
  template:
    metadata:
      labels:
        app: memlab
    spec:
      containers:
        - name: memlab
          image: REPLACE_ME/memlab:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            # memory は Mi (mebibytes) 表記にする(小文字 m はミリ単位になり誤設定になる)。
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memlab
  namespace: default
spec:
  selector:
    app: memlab
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
